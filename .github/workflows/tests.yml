name: Playwright + Cucumber Tests

on:
  push:
    branches: [ main, rest ]
  pull_request:
    branches: [ main, rest ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps

      - name: Executar testes Cucumber com Playwright
        run: npm run test

      - name: Analisar com LLM (pular se SKIP_LLM=true)
        if: env.SKIP_LLM != 'true'
        run: npm run analyze
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SKIP_LLM: ${{ env.SKIP_LLM }}

      - name: Instalar k6
        run: |
          curl -L https://github.com/grafana/k6/releases/download/v0.51.0/k6-v0.51.0-linux-amd64.tar.gz -o k6.tar.gz
          tar -xzf k6.tar.gz
          sudo mv k6-v0.51.0-linux-amd64/k6 /usr/local/bin/
          rm -rf k6.tar.gz k6-v0.51.0-linux-amd64

      - name: Executar testes de performance com k6
        run: npm run performance --out json=k6-report.json

      - name: Relatórios de Teste
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            test-results/
            playwright-report/
            k6-report.json